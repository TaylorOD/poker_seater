<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" type="image/png" href="/poker_seater/favicon.png" />

  <title>Poker Seat Randomizer</title>
  <style>
    :root {
      --room: #12100d;
      --panel: #1f1b16;
      --panel-line: #3a3228;
      --cream: #f5efe0;
      --muted: #b5aa95;
      --brass: #d8b25c;
      --brass-hover: #e8c777;
      --red: #e0584a;
      --felt: #0f6b42;
      --felt-dark: #09482c;
      --rail: #3b2415;
      --serif: Georgia, "Times New Roman", serif;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background-color: var(--room);
      color: var(--cream);
      font-family: var(--sans);
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 24px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    h1 {
      font-family: var(--serif);
      font-size: 2.5rem;
      font-weight: normal;
      margin: 0;
    }

    .suits {
      font-size: 1.25rem;
      letter-spacing: 0.5em;
      margin: 0 -0.5em 8px 0;
    }

    .suits .red {
      color: var(--red);
    }

    .tagline {
      color: var(--muted);
      margin: 8px 0 0;
    }

    main {
      width: 100%;
      max-width: 720px;
    }

    .panel {
      background-color: var(--panel);
      border: 1px solid var(--panel-line);
      border-radius: 12px;
      padding: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .add-row {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      min-width: 0;
      background-color: var(--room);
      border: 1px solid var(--panel-line);
      border-radius: 8px;
      color: var(--cream);
      font: inherit;
      padding: 12px;
    }

    input::placeholder {
      color: var(--muted);
    }

    button {
      border: 1px solid var(--panel-line);
      border-radius: 8px;
      background-color: transparent;
      color: var(--cream);
      cursor: pointer;
      font: inherit;
      font-weight: 600;
      padding: 12px 16px;
    }

    button:hover {
      border-color: var(--brass);
    }

    button.primary {
      background-color: var(--brass);
      border-color: var(--brass);
      color: var(--room);
    }

    button.primary:hover {
      background-color: var(--brass-hover);
      border-color: var(--brass-hover);
    }

    button.link {
      border: none;
      color: var(--muted);
      font-weight: normal;
      padding: 4px;
      text-decoration: underline;
    }

    button.link:hover {
      color: var(--cream);
    }

    input:focus-visible,
    button:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--brass);
      outline-offset: 2px;
    }

    #message {
      color: var(--red);
      font-weight: 600;
      margin: 12px 0 0;
    }

    #message:empty {
      display: none;
    }

    .players-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 20px;
    }

    .players-header h2 {
      font-size: 1rem;
      margin: 0;
    }

    #players-ul {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      list-style: none;
      margin: 12px 0 0;
      padding: 0;
    }

    #players-ul li {
      display: flex;
      align-items: center;
      gap: 4px;
      background-color: var(--room);
      border: 1px solid var(--panel-line);
      border-radius: 999px;
      max-width: 100%;
      padding: 2px 4px 2px 12px;
    }

    #players-ul span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #players-ul button {
      border: none;
      color: var(--muted);
      line-height: 1;
      padding: 8px;
    }

    #players-ul button:hover {
      color: var(--red);
    }

    #deal-button {
      margin-top: 20px;
      width: 100%;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
    }

    .actions button {
      flex: 1;
      white-space: nowrap;
    }

    .table-block {
      margin-bottom: 32px;
    }

    .poker-table {
      --rx: 36%;
      --ry: 44%;
      aspect-ratio: 4 / 5;
      position: relative;
      width: 100%;
    }

    .felt {
      position: absolute;
      inset: 7% 11%;
      background: radial-gradient(ellipse at center, var(--felt), var(--felt-dark));
      border: 10px solid var(--rail);
      border-radius: 50%;
      box-shadow: 0 0 0 2px var(--brass), 0 12px 32px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .felt-title {
      font-family: var(--serif);
      font-size: 1.5rem;
    }

    .felt-count {
      color: rgba(245, 239, 224, 0.75);
      font-size: 0.875rem;
      margin-top: 4px;
    }

    .seat {
      position: absolute;
      left: calc(50% + var(--cos) * var(--rx));
      top: calc(50% + var(--sin) * var(--ry));
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      gap: 6px;
      background-color: var(--cream);
      border-radius: 999px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
      color: var(--room);
      font-size: 0.875rem;
      font-weight: 600;
      max-width: 108px;
      padding: 4px 10px 4px 4px;
      animation: deal 0.35s ease-out backwards;
      animation-delay: calc(var(--order) * 60ms);
    }

    .seat-number {
      flex: none;
      width: 22px;
      height: 22px;
      line-height: 22px;
      background-color: var(--felt-dark);
      border-radius: 50%;
      color: var(--cream);
      font-size: 0.75rem;
      text-align: center;
    }

    .seat.dealer .seat-number {
      background-color: var(--brass);
      color: var(--room);
    }

    .seat-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    @keyframes deal {
      from {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.6);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .seat {
        animation: none;
      }
    }

    .table-heading {
      font-family: var(--serif);
      font-weight: normal;
      margin: 16px 0 0;
    }

    .seat-list {
      columns: 2;
      column-gap: 16px;
      color: var(--muted);
      margin: 16px 0 0;
      padding-left: 28px;
    }

    .seat-list li {
      break-inside: avoid;
      overflow-wrap: anywhere;
      padding: 2px 0;
    }

    .seat-list .player {
      color: var(--cream);
    }

    @media (min-width: 640px) {
      .poker-table {
        --rx: 42%;
        --ry: 40%;
        aspect-ratio: 16 / 9;
      }

      .felt {
        inset: 10% 8%;
      }

      .seat {
        max-width: 140px;
      }
    }

    footer {
      color: var(--muted);
      font-size: small;
      margin-top: auto;
      padding-top: 24px;
      text-align: center;
    }

    footer a {
      color: inherit;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
  <header>
    <div class="suits" aria-hidden="true">&#9827;<span class="red">&#9829;</span><span class="red">&#9830;</span>&#9824;</div>
    <h1 id="headline">Poker Seater</h1>
    <p class="tagline">Random seats, so nobody can say you gave yourself the best one.</p>
  </header>

  <main>
    <section class="panel" id="poker-form">
      <form id="add-form">
        <label for="player-names">Add players</label>
        <div class="add-row">
          <input id="player-names" type="text" autocomplete="off" placeholder="Rob, Sam, Kelly...">
          <button type="submit" id="add-player">Add</button>
        </div>
      </form>
      <p id="message" role="alert"></p>
      <div id="players-list" hidden>
        <div class="players-header">
          <h2>Players (<span id="players-count">0</span> of 20)</h2>
          <button type="button" class="link" id="clear-button">Clear all</button>
        </div>
        <ul id="players-ul"></ul>
      </div>
      <button type="button" class="primary" id="deal-button">Shuffle up and deal</button>
    </section>

    <section id="results" hidden>
      <div class="actions">
        <button type="button" class="primary" id="reshuffle-button">Reshuffle</button>
        <button type="button" id="copy-button">Copy seats</button>
        <button type="button" id="edit-button">Change players</button>
      </div>
      <div id="poker-table"></div>
    </section>
  </main>

  <footer>
    <p>This is a <a href="https://www.taylordorsett.com/">Taylor Dorsett</a> Production.</p>
  </footer>

  <script>

  document.addEventListener("DOMContentLoaded", () => {
      const storageKey = "poker-seater-players";
      const maxPlayers = 20;
      const maxPlayersPerTable = 10;
      const addForm = document.getElementById("add-form");
      const playerNameInput = document.getElementById("player-names");
      const messageEl = document.getElementById("message");
      const playersListDiv = document.getElementById("players-list");
      const playersUl = document.getElementById("players-ul");
      const playersCount = document.getElementById("players-count");
      const formSection = document.getElementById("poker-form");
      const resultsSection = document.getElementById("results");
      const pokerTable = document.getElementById("poker-table");
      const copyButton = document.getElementById("copy-button");
      const predefinedNames = ["Alice", "Bob", "Charlie", "David", "Emily", "Frank", "Grace", "Helen", "Ivan", "Jack", "Kelly", "Liam", "Maria", "Nathan", "Olivia", "Peter", "Quinn", "Rachel", "Samuel", "Teresa"];
      let pokerPlayers = loadPlayers();
      let seatingText = "";

      addForm.addEventListener("submit", (event) => {
        event.preventDefault();
        addPlayers();
      });
      document.getElementById("deal-button").addEventListener("click", dealTables);
      document.getElementById("reshuffle-button").addEventListener("click", dealTables);
      document.getElementById("clear-button").addEventListener("click", () => {
        pokerPlayers = [];
        savePlayers();
        renderPlayers();
      });
      document.getElementById("edit-button").addEventListener("click", () => {
        resultsSection.hidden = true;
        formSection.hidden = false;
        playerNameInput.focus();
      });
      copyButton.addEventListener("click", copySeats);

      renderPlayers();

      function loadPlayers() {
        try {
          const saved = JSON.parse(localStorage.getItem(storageKey));
          return Array.isArray(saved) ? saved.filter(name => typeof name === "string").slice(0, maxPlayers) : [];
        } catch (error) {
          return [];
        }
      }

      function savePlayers() {
        try {
          localStorage.setItem(storageKey, JSON.stringify(pokerPlayers));
        } catch (error) {
          // The list just wont be remembered next time
        }
      }

      function addPlayers() {
        const input = playerNameInput.value.trim();
        let playerNames = [];

        if (input.toLowerCase() === "test, test" && pokerPlayers.length === 0) {
          playerNames = predefinedNames;
        } else {
          playerNames = input.split(",").map(name => name.trim()).filter(name => name);
        }

        if (pokerPlayers.length + playerNames.length > maxPlayers) {
          showMessage(`Cannot add more than ${maxPlayers} players.`);
          return;
        }

        pokerPlayers = pokerPlayers.concat(playerNames);
        playerNameInput.value = "";
        showMessage("");
        savePlayers();
        renderPlayers();
      }

      function removePlayer(index) {
        pokerPlayers.splice(index, 1);
        savePlayers();
        renderPlayers();
      }

      function renderPlayers() {
        playersUl.innerHTML = "";
        pokerPlayers.forEach((playerName, index) => {
          const listItem = document.createElement("li");
          const nameSpan = document.createElement("span");
          nameSpan.textContent = playerName;
          const removeButton = document.createElement("button");
          removeButton.type = "button";
          removeButton.textContent = "×";
          removeButton.setAttribute("aria-label", `Remove ${playerName}`);
          removeButton.addEventListener("click", () => removePlayer(index));
          listItem.append(nameSpan, removeButton);
          playersUl.appendChild(listItem);
        });
        playersCount.textContent = pokerPlayers.length;
        playersListDiv.hidden = pokerPlayers.length === 0;
      }

      function showMessage(message) {
        messageEl.textContent = message;
      }

      function dealTables() {
        if (pokerPlayers.length === 0) {
          showMessage("Please enter at least one player name.");
          return;
        }
        showMessage("");

        const shuffledPlayers = shuffleArray(pokerPlayers);
        let tables = [shuffledPlayers];

        if (shuffledPlayers.length > maxPlayersPerTable) {
          const midPoint = Math.ceil(shuffledPlayers.length / 2);
          tables = [shuffledPlayers.slice(0, midPoint), shuffledPlayers.slice(midPoint)];
        }

        const tableNames = ["Table One", "Table Two"];
        pokerTable.innerHTML = "";
        tables.forEach((players, index) => pokerTable.appendChild(createTable(tableNames[index], players)));
        seatingText = tables.map((players, index) => createSeatingText(tableNames[index], players)).join("\n\n");

        copyButton.textContent = "Copy seats";
        formSection.hidden = true;
        resultsSection.hidden = false;
      }

      function shuffleArray(array) {
        const shuffled = [...array];
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
      }

      function createTable(tableName, players) {
        const block = document.createElement("div");
        block.className = "table-block";

        const table = document.createElement("div");
        table.className = "poker-table";
        table.setAttribute("aria-hidden", "true");

        const felt = document.createElement("div");
        felt.className = "felt";
        const title = document.createElement("div");
        title.className = "felt-title";
        title.textContent = tableName;
        const count = document.createElement("div");
        count.className = "felt-count";
        count.textContent = players.length === 1 ? "1 player" : `${players.length} players`;
        felt.append(title, count);
        table.appendChild(felt);

        players.forEach((player, index) => {
          // Seat 1 sits at the bottom of the table and the rest go clockwise
          const angle = Math.PI / 2 + (index / players.length) * Math.PI * 2;
          const seat = document.createElement("div");
          seat.className = index === 0 ? "seat dealer" : "seat";
          seat.style.setProperty("--cos", Math.cos(angle).toFixed(4));
          seat.style.setProperty("--sin", Math.sin(angle).toFixed(4));
          seat.style.setProperty("--order", index);
          seat.title = player;

          const number = document.createElement("span");
          number.className = "seat-number";
          number.textContent = index === 0 ? "D" : index + 1;
          const name = document.createElement("span");
          name.className = "seat-name";
          name.textContent = player;
          seat.append(number, name);
          table.appendChild(seat);
        });

        const heading = document.createElement("h2");
        heading.className = "table-heading";
        heading.textContent = tableName;

        const list = document.createElement("ol");
        list.className = "seat-list";
        players.forEach((player, index) => {
          const item = document.createElement("li");
          const name = document.createElement("span");
          name.className = "player";
          name.textContent = index === 0 ? `${player} (dealer)` : player;
          item.appendChild(name);
          list.appendChild(item);
        });

        block.append(table, heading, list);
        return block;
      }

      function createSeatingText(tableName, players) {
        const seats = players.map((player, index) => {
          return `Seat ${index + 1}: ${player}${index === 0 ? " (dealer)" : ""}`;
        });
        return [`${tableName}:`, ...seats].join("\n");
      }

      async function copySeats() {
        try {
          await navigator.clipboard.writeText(seatingText);
          copyButton.textContent = "Copied!";
        } catch (error) {
          copyButton.textContent = copyWithTextarea() ? "Copied!" : "Could not copy";
        }
      }

      // Backup for browsers that block the clipboard API
      function copyWithTextarea() {
        const textarea = document.createElement("textarea");
        textarea.value = seatingText;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        const copied = document.execCommand("copy");
        textarea.remove();
        return copied;
      }
    });

  </script>
</body>

</html>
