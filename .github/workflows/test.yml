name: Tests

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Save failure details
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
